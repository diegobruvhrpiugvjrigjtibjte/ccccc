<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ravexis Editor PRO - CAD Modeling</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0a0a0a; color: #e5e7eb; font-family: 'Segoe UI', Roboto, sans-serif; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; transition: padding 0.3s ease; outline: none; }
        .ui-panel { background: rgba(18, 18, 20, 0.98); border: 1px solid rgba(255,255,255,0.05); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .side-bar-left { transform: translateX(0); }
        .side-bar-left.closed { transform: translateX(-100%); }
        .side-bar-right { transform: translateX(0); }
        .side-bar-right.closed { transform: translateX(100%); }
        
        .toggle-btn { position: absolute; top: 50%; width: 20px; height: 60px; background: #2563eb; color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 100; border-radius: 4px; font-size: 12px; }
        .toggle-left { right: -20px; border-radius: 0 4px 4px 0; }
        .toggle-right { left: -20px; border-radius: 4px 0 0 4px; }

        .tool-btn { transition: all 0.1s; border-radius: 4px; padding: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 10px; text-transform: uppercase; font-weight: 600; border: 1px solid transparent; background: #1a1a1d; }
        .tool-btn:hover { background: #27272a; border-color: #3f3f46; }
        .tool-btn.active { background: #2563eb; color: white; border-color: #3b82f6; }
        
        .loading-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 2000; align-items: center; justify-content: center; flex-direction: column; }
        input[type="range"] { accent-color: #2563eb; height: 4px; }
        select, input[type="text"], input[type="number"] { background: #000; border: 1px solid #333; border-radius: 4px; padding: 4px 8px; font-size: 11px; color: #fff; }
        .cad-label { font-size: 10px; color: #52525b; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 800; margin-bottom: 8px; display: block; border-bottom: 1px solid #27272a; padding-bottom: 4px; }
    </style>
</head>
<body>

    <div id="loading" class="loading-overlay">
        <div class="w-12 h-12 border-2 border-blue-600 border-t-transparent rounded-full animate-spin mb-4"></div>
        <h2 class="text-sm font-mono text-white tracking-[0.3em]">RAVEXIS_CORE_RENDER</h2>
        <p id="render-status" class="text-zinc-500 font-mono text-[10px] mt-2 italic">CAMPIONAMENTO_VETTORI_LUCE...</p>
    </div>

    <!-- Menu Superiore -->
    <nav class="fixed top-0 left-0 right-0 h-10 ui-panel z-50 flex items-center justify-between px-4 border-b">
        <div class="flex items-center gap-4">
            <h1 class="text-sm font-black tracking-widest text-white">RAVEXIS<span class="text-blue-500 underline decoration-2 underline-offset-4">PRO</span></h1>
            <div class="h-4 w-px bg-zinc-800"></div>
            <button onclick="document.getElementById('stl-input').click()" class="text-[9px] hover:text-white px-2 py-1 bg-zinc-900 border border-zinc-800 rounded">IMPORTA STL</button>
            <button onclick="exportScene()" class="text-[9px] hover:text-white px-2 py-1 bg-zinc-900 border border-zinc-800 rounded">ESPORTA PNG</button>
            <input type="file" id="stl-input" accept=".stl" class="hidden" onchange="loadSTL(event)">
        </div>
        <div class="flex items-center gap-2">
            <div class="flex bg-black p-0.5 rounded border border-zinc-800">
                <button onclick="setTransformMode('translate')" class="px-2 py-1 text-[9px] hover:bg-zinc-800">SPOSTA</button>
                <button onclick="setTransformMode('rotate')" class="px-2 py-1 text-[9px] hover:bg-zinc-800">RUOTA</button>
                <button onclick="setTransformMode('scale')" class="px-2 py-1 text-[9px] hover:bg-zinc-800">SCALA</button>
            </div>
            <button onclick="togglePathTracing()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1 rounded text-[9px] font-bold tracking-tight">PATH_TRACE</button>
            <button onclick="exportPathTracedPNG()" class="bg-zinc-800 hover:bg-zinc-700 text-white px-3 py-1 rounded text-[9px] font-bold tracking-tight">EXPORT_PT</button>
            <button onclick="startUltraRender()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-1 rounded text-[9px] font-bold tracking-tighter">RENDER_ULTRA</button>
        </div>
    </nav>

    <!-- Sidebar Sinistra -->
    <aside id="sidebar-left" class="fixed left-0 top-10 bottom-0 w-40 ui-panel p-3 z-50 border-r side-bar-left">
        <div class="toggle-btn toggle-left" onclick="toggleSidebar('left')"><span>‹</span></div>
        
        <div class="mb-6">
            <span class="cad-label">Area di Lavoro</span>
            <div class="flex flex-col gap-1">
                <button id="tool-select" onclick="setTool('select')" class="tool-btn active text-left justify-start px-3">Seleziona</button>
                <button id="tool-paint" onclick="setTool('paint')" class="tool-btn text-left justify-start px-3">Colora</button>
                <button id="tool-boolean" onclick="setTool('boolean')" class="tool-btn text-left justify-start px-3 text-red-500 border-red-900/50">Elimina (Click/Canc)</button>
            </div>
            <p class="text-[8px] text-zinc-600 mt-2 px-1">Tip: Clicca sul modello per selezionare. Clicca fuori per deselezionare.</p>
        </div>

        <div>
            <span class="cad-label">Primitive</span>
            <div class="grid grid-cols-2 gap-1">
                <button onclick="addPrimitive('box')" class="tool-btn">CUBO</button>
                <button onclick="addPrimitive('sphere')" class="tool-btn">SFERA</button>
                <button onclick="addPrimitive('cylinder')" class="tool-btn">CILIN</button>
                <button onclick="addPrimitive('torus')" class="tool-btn">TORO</button>
                <button onclick="addPrimitive('cone')" class="tool-btn">CONO</button>
                <button onclick="addPrimitive('pyramid')" class="tool-btn">PIRAM</button>
                <button onclick="addPrimitive('octa')" class="tool-btn">OTTA</button>
                <button onclick="addPrimitive('ring')" class="tool-btn">ANELLO</button>
            </div>
        </div>
    </aside>

    <!-- Sidebar Destra -->
    <aside id="sidebar-right" class="fixed right-0 top-10 bottom-0 w-60 ui-panel p-4 z-50 border-l side-bar-right">
        <div class="toggle-btn toggle-right" onclick="toggleSidebar('right')"><span>›</span></div>

        <section class="mb-6">
            <span class="cad-label">Ispettore</span>
            <div class="space-y-3">
                <div>
                    <label class="text-[9px] text-zinc-500 block mb-1">Colore</label>
                    <input type="color" id="mat-color" class="w-full h-6 cursor-pointer border-0 p-0 bg-transparent" value="#3b82f6" oninput="updateActiveObject()">
                </div>
                <div>
                    <label class="text-[9px] text-zinc-500 block mb-1">Rugosità</label>
                    <input type="range" id="mat-roughness" min="0" max="1" step="0.01" class="w-full" value="0.25" oninput="updateActiveObject()">
                </div>
                <div>
                    <label class="text-[9px] text-zinc-500 block mb-1">Metallicità</label>
                    <input type="range" id="mat-metal" min="0" max="1" step="0.01" class="w-full" value="0.6" oninput="updateActiveObject()">
                </div>
                <div>
                    <label class="text-[9px] text-zinc-500 block mb-1">Intensità Environment</label>
                    <input type="range" id="mat-env" min="0" max="2" step="0.01" class="w-full" value="1.2" oninput="updateActiveObject()">
                </div>
            </div>
        </section>

        <section class="mb-6">
            <span class="cad-label">Ambiente HDRI</span>
            <div class="space-y-3">
                <div class="flex flex-col gap-2">
                    <button onclick="document.getElementById('bg-input').click()" class="bg-zinc-800 text-[9px] py-1.5 rounded hover:bg-zinc-700 transition font-bold uppercase">Carica HDR (.hdr)</button>
                    <input type="file" id="bg-input" accept=".hdr" class="hidden" onchange="uploadEnvironment(event)">
                </div>
                <div class="h-px bg-zinc-800 my-2"></div>
                <select id="env-map" class="w-full" onchange="updateEnvironment()">
                    <option value="sunset">Venice Sunset</option>
                    <option value="warehouse">Industrial Sunset</option>
                </select>
            </div>
        </section>

        <section class="border-t border-zinc-800 pt-4 mt-auto">
            <span class="cad-label">Impostazioni Stage</span>
            <div class="space-y-3">
                <div>
                    <label class="text-[9px] text-zinc-500 block mb-1">Colore Piano</label>
                    <input type="color" id="floor-color" class="w-full h-6" value="#0f0f10" oninput="updateFloor()">
                </div>
                <div>
                    <label class="text-[9px] text-zinc-500 block mb-1">Riflettività</label>
                    <input type="range" id="floor-reflect" min="0" max="1" step="0.01" value="0.4" class="w-full" oninput="updateFloor()">
                </div>
            </div>
        </section>
    </aside>

    <div id="canvas-container" tabindex="0"></div>

    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js';
        import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/controls/OrbitControls.js';
        import { TransformControls } from 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/controls/TransformControls.js';
        import { STLLoader } from 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/loaders/STLLoader.js';
        import { RGBELoader } from 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/loaders/RGBELoader.js';
        import { Reflector } from 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/objects/Reflector.js';
        import { ContactShadows } from 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/objects/ContactShadows.js';
        import { BufferGeometryUtils } from 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/utils/BufferGeometryUtils.js';
        import {
            PathTracingRenderer,
            PhysicalPathTracingMaterial,
            PathTracingSceneGenerator
        } from 'https://cdn.jsdelivr.net/npm/three-gpu-pathtracer@0.0.19/build/index.module.js';

        let scene, camera, renderer, controls, transformControls, raycaster;
        let objects = [];
        let selectedObject = null;
        let currentTool = 'select';
        let floor, grid, contactShadows, reflector;
        let pmremGenerator;
        let hdrTexture = null;
        let envMap = null;
        let pathTracingRenderer;
        let pathTracingMaterial;
        let pathTracingSceneGenerator;
        let pathTracingEnabled = false;
        let isPathTracingSceneDirty = true;

        const hdrPresets = {
            sunset: 'https://rawcdn.githack.com/mrdoob/three.js/r128/examples/textures/equirectangular/venice_sunset_1k.hdr',
            warehouse: 'https://rawcdn.githack.com/mrdoob/three.js/r128/examples/textures/equirectangular/industrial_sunset_1k.hdr'
        };

        function toggleSidebar(side) {
            const el = document.getElementById(`sidebar-${side}`);
            const btn = el.querySelector('.toggle-btn span');
            el.classList.toggle('closed');
            if (side === 'left') {
                btn.innerText = el.classList.contains('closed') ? '›' : '‹';
            } else {
                btn.innerText = el.classList.contains('closed') ? '‹' : '›';
            }
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);

            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.set(18, 12, 18);
            camera.fov = 35;
            camera.filmGauge = 36;
            camera.filmOffset = 0;
            camera.focus = 12;
            camera.aperture = 0.015;
            camera.updateProjectionMatrix();

            renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 0.85;
            renderer.physicallyCorrectLights = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            pmremGenerator = new THREE.PMREMGenerator(renderer);
            pmremGenerator.compileEquirectangularShader();

            initPathTracing();

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.addEventListener('change', () => {
                if (pathTracingEnabled) {
                    resetPathTracingSamples();
                }
            });

            transformControls = new TransformControls(camera, renderer.domElement);
            transformControls.addEventListener('dragging-changed', (e) => controls.enabled = !e.value);
            transformControls.addEventListener('objectChange', () => {
                markPTDirty();
            });
            scene.add(transformControls);

            raycaster = new THREE.Raycaster();

            grid = new THREE.GridHelper(100, 100, 0x1f1f1f, 0x161616);
            grid.name = "SYSTEM_GRID";
            scene.add(grid);

            setupEnvironment(hdrPresets.sunset, true);
            const keyLight = new THREE.DirectionalLight(0xffffff, 3.2);
            keyLight.position.set(8, 12, 6);
            scene.add(keyLight);

            const floorGeo = new THREE.PlaneGeometry(1000, 1000);
            const floorMat = new THREE.MeshPhysicalMaterial({ 
                color: 0x0f0f10,
                roughness: 0.25,
                metalness: 0.0,
                clearcoat: 0.4,
                clearcoatRoughness: 0.25,
                envMapIntensity: 1.0
            });
            floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = 0;
            floor.receiveShadow = true;
            floor.name = "SYSTEM_FLOOR";
            scene.add(floor);

            reflector = new Reflector(new THREE.PlaneGeometry(1000, 1000), {
                textureWidth: window.innerWidth * window.devicePixelRatio,
                textureHeight: window.innerHeight * window.devicePixelRatio,
                color: 0x101010
            });
            reflector.rotation.x = -Math.PI / 2;
            reflector.position.y = 0.001;
            scene.add(reflector);

            contactShadows = new ContactShadows(20, 20, 0.5, 1024);
            contactShadows.position.y = 0.01;
            contactShadows.rotation.x = -Math.PI / 2;
            contactShadows.opacity = 0.85;
            contactShadows.blur = 2.8;
            contactShadows.darkness = 0.4;
            scene.add(contactShadows);

            window.addEventListener('resize', onWindowResize);
            
            renderer.domElement.addEventListener('pointerdown', onPointerDown, false);
            
            window.addEventListener('keydown', (event) => {
                if ((event.key === "Delete" || event.key === "Backspace")) {
                    deleteActiveObject();
                }
                if (event.key === "Escape") {
                    deselectAll();
                }
            });
            
            addPrimitive('box');
            updatePathTracingUI();
            animate();
        }

        function setupEnvironment(hdrUrl, setBackground) {
            new RGBELoader()
                .setDataType(THREE.HalfFloatType)
                .load(hdrUrl, (texture) => {
                    if (hdrTexture) {
                        hdrTexture.dispose();
                    }
                    if (envMap) {
                        envMap.dispose();
                    }
                    hdrTexture = texture;
                    envMap = pmremGenerator.fromEquirectangular(texture).texture;
                    scene.environment = envMap;
                    scene.environmentIntensity = 1.8;
                    scene.background = new THREE.Color(0x0f0f10);
                    updatePathTracingEnvironment();
                }, undefined, () => {
                    console.warn('HDRI load failed, retaining previous environment.');
                });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (pathTracingRenderer) {
                pathTracingRenderer.setSize(window.innerWidth, window.innerHeight);
            }
        }

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tool-${tool}`).classList.add('active');
            
            if (tool === 'boolean' && selectedObject) {
                deleteActiveObject();
                setTimeout(() => setTool('select'), 100);
                return;
            }

            if (tool !== 'select') {
                transformControls.detach();
            } else if (selectedObject) {
                transformControls.attach(selectedObject);
            }
        }

        function setTransformMode(mode) {
            transformControls.setMode(mode);
            if (selectedObject) transformControls.attach(selectedObject);
        }

        function deleteActiveObject() {
            if (!selectedObject) return;
            const target = selectedObject;
            deselectAll();
            scene.remove(target);
            
            if (target.geometry) target.geometry.dispose();
            if (target.material) target.material.dispose();

            const index = objects.indexOf(target);
            if (index > -1) objects.splice(index, 1);
            markPTDirty();
        }

        function deselectAll() {
            transformControls.detach();
            selectedObject = null;
        }

        function onPointerDown(event) {
            if (event.button !== 0 || transformControls.dragging) return;
            if (transformControls.axis !== null) return;

            const rect = renderer.domElement.getBoundingClientRect();
            const mouse = new THREE.Vector2(
                ((event.clientX - rect.left) / rect.width) * 2 - 1,
                -((event.clientY - rect.top) / rect.height) * 2 + 1
            );
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(objects, true);

            if (intersects.length > 0) {
                let clickedObject = intersects[0].object;
                while (clickedObject.parent && clickedObject.parent !== scene && !objects.includes(clickedObject)) {
                    clickedObject = clickedObject.parent;
                }

                if (currentTool === 'select') {
                    if (selectedObject !== clickedObject) {
                        selectedObject = clickedObject;
                        transformControls.attach(selectedObject);
                        
                        if(selectedObject.material) {
                            document.getElementById('mat-color').value = "#" + selectedObject.material.color.getHexString();
                            document.getElementById('mat-roughness').value = selectedObject.material.roughness;
                            document.getElementById('mat-metal').value = selectedObject.material.metalness; 
                            document.getElementById('mat-env').value = selectedObject.material.envMapIntensity || 1;
                        }
                    }
                } else if (currentTool === 'paint') {
                    if(clickedObject.material) {
                        clickedObject.material.color.set(document.getElementById('mat-color').value);
                    }
                } else if (currentTool === 'boolean') {
                    selectedObject = clickedObject;
                    deleteActiveObject();
                }
            } else {
                deselectAll();
            }
        }

        function randomizeRoughness(base, variance = 0.03) {
            const offset = (Math.random() * variance) - variance / 2;
            return Math.min(1, Math.max(0, base + offset));
        }

        function softenEdges(geometry) {
            const merged = BufferGeometryUtils.mergeVertices(geometry);
            merged.computeVertexNormals();
            const pos = merged.attributes.position;
            const normals = merged.attributes.normal;
            for (let i = 0; i < pos.count; i++) {
                const nx = normals.getX(i);
                const ny = normals.getY(i);
                const nz = normals.getZ(i);
                pos.setX(i, pos.getX(i) + nx * 0.002);
                pos.setY(i, pos.getY(i) + ny * 0.002);
                pos.setZ(i, pos.getZ(i) + nz * 0.002);
            }
            return merged;
        }

        function createGoldMaterial() {
            return new THREE.MeshPhysicalMaterial({
                color: 0xffd27c,
                roughness: randomizeRoughness(0.15, 0.04),
                metalness: 1.0,
                transmission: 0.0,
                ior: 1.0,
                clearcoat: 0.2,
                clearcoatRoughness: 0.1,
                envMapIntensity: 1.4
            });
        }

        function createSilverSatinMaterial() {
            return new THREE.MeshPhysicalMaterial({
                color: 0xd1d5db,
                roughness: randomizeRoughness(0.4, 0.05),
                metalness: 1.0,
                transmission: 0.0,
                ior: 1.0,
                clearcoat: 0.15,
                clearcoatRoughness: 0.2,
                envMapIntensity: 1.1
            });
        }

        function createBrushedMetalMaterial() {
            return new THREE.MeshPhysicalMaterial({
                color: 0x9ca3af,
                roughness: randomizeRoughness(0.55, 0.06),
                metalness: 1.0,
                transmission: 0.0,
                ior: 1.0,
                clearcoat: 0.1,
                clearcoatRoughness: 0.25,
                envMapIntensity: 1.0
            });
        }

        function createMattePlasticMaterial() {
            return new THREE.MeshPhysicalMaterial({
                color: 0x3b82f6,
                roughness: randomizeRoughness(0.65, 0.05),
                metalness: 0.0,
                transmission: 0.0,
                ior: 1.45,
                clearcoat: 0.0,
                envMapIntensity: 0.8
            });
        }

        function createGlossyPlasticMaterial() {
            return new THREE.MeshPhysicalMaterial({
                color: 0x3b82f6,
                roughness: randomizeRoughness(0.2, 0.04),
                metalness: 0.0,
                transmission: 0.0,
                ior: 1.45,
                clearcoat: 0.7,
                clearcoatRoughness: 0.08,
                envMapIntensity: 1.1
            });
        }

        function createGlassMaterial() {
            return new THREE.MeshPhysicalMaterial({ 
                color: 0xffffff, 
                roughness: randomizeRoughness(0.02, 0.02), 
                metalness: 0.0,
                transmission: 1.0,
                thickness: 0.5,
                ior: 1.5,
                clearcoat: 0.2,
                clearcoatRoughness: 0.02,
                envMapIntensity: 1.3
            });
        }

        function getHighDetailGeometry(type) {
            switch(type) {
                case 'box': return new THREE.BoxGeometry(2, 2, 2, 4, 4, 4);
                case 'sphere': return new THREE.SphereGeometry(1.5, 96, 96);
                case 'cylinder': return new THREE.CylinderGeometry(1, 1, 3, 64, 32, false);
                case 'torus': return new THREE.TorusGeometry(1.2, 0.4, 64, 256);
                case 'cone': return new THREE.ConeGeometry(1.5, 3, 64, 32);
                case 'pyramid': return new THREE.ConeGeometry(1.5, 2, 4, 1);
                case 'octa': return new THREE.OctahedronGeometry(1.5, 2);
                case 'ring': return new THREE.RingGeometry(1, 1.5, 128, 8);
                default: return new THREE.BoxGeometry(2, 2, 2, 4, 4, 4);
            }
        }

        function getLowDetailGeometry(type) {
            switch(type) {
                case 'box': return new THREE.BoxGeometry(2, 2, 2, 1, 1, 1);
                case 'sphere': return new THREE.SphereGeometry(1.5, 32, 24);
                case 'cylinder': return new THREE.CylinderGeometry(1, 1, 3, 24, 8, false);
                case 'torus': return new THREE.TorusGeometry(1.2, 0.4, 16, 48);
                case 'cone': return new THREE.ConeGeometry(1.5, 3, 24, 8);
                case 'pyramid': return new THREE.ConeGeometry(1.5, 2, 4, 1);
                case 'octa': return new THREE.OctahedronGeometry(1.5, 0);
                case 'ring': return new THREE.RingGeometry(1, 1.5, 32, 1);
                default: return new THREE.BoxGeometry(2, 2, 2, 1, 1, 1);
            }
        }

        function addPrimitive(type) {
            let geometry = getHighDetailGeometry(type);
            const lowGeometry = getLowDetailGeometry(type);
            geometry = softenEdges(geometry);
            
            const material = createGlossyPlasticMaterial();
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.y = 1.5;
            mesh.rotation.y += (Math.random() - 0.5) * 0.03;
            mesh.position.x += (Math.random() - 0.5) * 0.05;
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.userData.lowDetailGeometry = lowGeometry;
            scene.add(mesh);
            objects.push(mesh);
            markPTDirty();
            
            selectedObject = mesh;
            transformControls.attach(mesh);
            setTool('select');
        }

        function uploadEnvironment(event) {
            const file = event.target.files[0];
            if (!file) return;
            const objectUrl = URL.createObjectURL(file);
            setupEnvironment(objectUrl, true);
        }

        function updateEnvironment() {
            const type = document.getElementById('env-map').value;
            setupEnvironment(hdrPresets[type], true);
        }

        function updateActiveObject() {
            if (!selectedObject) return;
            selectedObject.material.color.set(document.getElementById('mat-color').value);
            selectedObject.material.roughness = parseFloat(document.getElementById('mat-roughness').value);
            selectedObject.material.metalness = parseFloat(document.getElementById('mat-metal').value);
            selectedObject.material.envMapIntensity = parseFloat(document.getElementById('mat-env').value);
            selectedObject.material.needsUpdate = true;
            markPTDirty();
        }

        function updateFloor() {
            const reflect = parseFloat(document.getElementById('floor-reflect').value);
            floor.material.color.set(document.getElementById('floor-color').value);
            floor.material.roughness = Math.max(0.02, 1 - reflect);
            floor.material.clearcoat = reflect;
            floor.material.clearcoatRoughness = Math.max(0.02, 0.2 - reflect * 0.15);
            floor.material.envMapIntensity = 1 + reflect;
            floor.material.needsUpdate = true;
            markPTDirty();
        }

        function startUltraRender() {
            if (pathTracingEnabled) {
                exportPathTracedPNG();
                return;
            }
            const loading = document.getElementById('loading');
            loading.style.display = 'flex';
            transformControls.detach();
            grid.visible = false;
            const exportScale = 2;
            const width = Math.floor(window.innerWidth * exportScale);
            const height = Math.floor(window.innerHeight * exportScale);
            const target = new THREE.WebGLRenderTarget(width, height);

            setTimeout(() => {
                renderer.setRenderTarget(target);
                renderer.render(scene, camera);
                const buffer = new Uint8Array(width * height * 4);
                renderer.readRenderTargetPixels(target, 0, 0, width, height, buffer);
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                const imageData = ctx.createImageData(width, height);
                for (let y = 0; y < height; y += 1) {
                    const row = height - y - 1;
                    for (let x = 0; x < width; x += 1) {
                        const src = (row * width + x) * 4;
                        const dst = (y * width + x) * 4;
                        imageData.data[dst] = buffer[src];
                        imageData.data[dst + 1] = buffer[src + 1];
                        imageData.data[dst + 2] = buffer[src + 2];
                        imageData.data[dst + 3] = buffer[src + 3];
                    }
                }
                ctx.putImageData(imageData, 0, 0);
                const link = document.createElement('a');
                link.download = 'Ravexis_Render_Ultra.png';
                link.href = canvas.toDataURL("image/png");
                link.click();
                renderer.setRenderTarget(null);
                target.dispose();
                grid.visible = true;
                loading.style.display = 'none';
                if(selectedObject) transformControls.attach(selectedObject);
            }, 2000);
        }

        function exportScene() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            const target = new THREE.WebGLRenderTarget(width, height);
            renderer.setRenderTarget(target);
            renderer.render(scene, camera);
            const buffer = new Uint8Array(width * height * 4);
            renderer.readRenderTargetPixels(target, 0, 0, width, height, buffer);
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            const imageData = ctx.createImageData(width, height);
            for (let y = 0; y < height; y += 1) {
                const row = height - y - 1;
                for (let x = 0; x < width; x += 1) {
                    const src = (row * width + x) * 4;
                    const dst = (y * width + x) * 4;
                    imageData.data[dst] = buffer[src];
                    imageData.data[dst + 1] = buffer[src + 1];
                    imageData.data[dst + 2] = buffer[src + 2];
                    imageData.data[dst + 3] = buffer[src + 3];
                }
            }
            ctx.putImageData(imageData, 0, 0);
            renderer.setRenderTarget(null);
            target.dispose();
            const link = document.createElement('a');
            link.download = 'Ravexis_Screenshot.png';
            link.href = canvas.toDataURL();
            link.click();
        }

        function loadSTL(event) {
            const file = event.target.files[0];
            const reader = new FileReader();
            reader.onload = (e) => {
                const loader = new STLLoader();
                let geometry = loader.parse(e.target.result);
                geometry.computeVertexNormals();
                geometry = softenEdges(geometry);
                const material = createGlossyPlasticMaterial();
                const mesh = new THREE.Mesh(geometry, material);
                mesh.rotation.x = -Math.PI / 2;
                mesh.scale.set(0.1, 0.1, 0.1);
                mesh.rotation.y += (Math.random() - 0.5) * 0.03;
                mesh.position.x += (Math.random() - 0.5) * 0.05;
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                mesh.userData.lowDetailGeometry = geometry.clone();
                scene.add(mesh);
                objects.push(mesh);
                selectedObject = mesh;
                transformControls.attach(mesh);
                markPTDirty();
            };
            reader.readAsArrayBuffer(file);
        }

        function initPathTracing() {
            pathTracingRenderer = new PathTracingRenderer(renderer);
            pathTracingRenderer.tiles.set(2, 2);
            pathTracingRenderer.setSize(window.innerWidth, window.innerHeight);
            pathTracingRenderer.camera = camera;

            pathTracingMaterial = new PhysicalPathTracingMaterial();
            pathTracingMaterial.bounces = 10;
            pathTracingMaterial.filterGlossyFactor = 0.1;
            pathTracingMaterial.environmentIntensity = 1.0;
            pathTracingMaterial.environmentMap = envMap;
            pathTracingMaterial.physicalCamera = true;
            pathTracingMaterial.camera = camera;
            pathTracingMaterial.aperture = 0.015;
            pathTracingMaterial.focusDistance = 12;
            pathTracingRenderer.material = pathTracingMaterial;

            pathTracingSceneGenerator = new PathTracingSceneGenerator();

        }

        function updatePathTracingEnvironment() {
            if (pathTracingMaterial && envMap) {
                pathTracingMaterial.environmentMap = envMap;
            }
            isPathTracingSceneDirty = true;
        }

        function updatePathTracingScene() {
            if (!pathTracingEnabled) return;

            const result = pathTracingSceneGenerator.generate(scene);

            pathTracingMaterial.materials.updateFrom(result.materials, result.textures);
            pathTracingRenderer.setScene(result.scene, camera);

            pathTracingRenderer.reset();
            isPathTracingSceneDirty = false;
        }

        function resetPathTracingSamples() {
            pathTracingRenderer.reset();
        }

        function togglePathTracing() {
            pathTracingEnabled = !pathTracingEnabled;
            grid.visible = !pathTracingEnabled;
            contactShadows.visible = !pathTracingEnabled;
            reflector.visible = !pathTracingEnabled;
            if (pathTracingEnabled) {
                updatePathTracingEnvironment();
                updatePathTracingScene();
            }
            updatePathTracingUI();
        }

        function renderPathTracing() {
            if (isPathTracingSceneDirty) {
                updatePathTracingScene();
            }

            pathTracingRenderer.update();
            isPathTracingSceneDirty = false;
        }

        function markPTDirty() {
            if (pathTracingEnabled) {
                isPathTracingSceneDirty = true;
                pathTracingRenderer.reset();
            }
        }

        function exportPathTracedPNG() {
            if (!pathTracingEnabled) return;
            const texture = pathTracingRenderer.renderTarget.texture;

            const width = texture.image.width;
            const height = texture.image.height;

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(pathTracingRenderer.domElement, 0, 0);

            const link = document.createElement('a');
            link.download = 'Ravexis_PathTrace.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function updatePathTracingUI() {
            const pathTraceButton = document.querySelector('button[onclick="togglePathTracing()"]');
            const renderUltraButton = document.querySelector('button[onclick="startUltraRender()"]');
            if (!pathTraceButton || !renderUltraButton) return;
            pathTraceButton.classList.toggle('bg-emerald-600', !pathTracingEnabled);
            pathTraceButton.classList.toggle('bg-emerald-400', pathTracingEnabled);
            pathTraceButton.textContent = pathTracingEnabled ? 'PATH_TRACE ON' : 'PATH_TRACE';
            renderUltraButton.textContent = pathTracingEnabled ? 'RENDER_PT' : 'RENDER_ULTRA';
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            if (contactShadows && !pathTracingEnabled) {
                contactShadows.render(renderer, scene);
            }
            if (pathTracingEnabled) {
                renderPathTracing();
            } else {
                renderer.render(scene, camera);
            }
        }

        window.toggleSidebar = toggleSidebar;
        window.setTool = setTool;
        window.setTransformMode = setTransformMode;
        window.deleteActiveObject = deleteActiveObject;
        window.deselectAll = deselectAll;
        window.addPrimitive = addPrimitive;
        window.uploadEnvironment = uploadEnvironment;
        window.updateEnvironment = updateEnvironment;
        window.updateActiveObject = updateActiveObject;
        window.updateFloor = updateFloor;
        window.startUltraRender = startUltraRender;
        window.togglePathTracing = togglePathTracing;
        window.exportPathTracedPNG = exportPathTracedPNG;
        window.exportScene = exportScene;
        window.loadSTL = loadSTL;

        window.onload = init;
    </script>
</body>
</html>
